<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Embudo · Casa Embrujada</title>
<meta name="robots" content="noindex">
<style>
:root{--night:#2b1747;--night-2:#3b2163;--pumpkin:#ff7a1a;--pumpkin-2:#ffa24d;--bone:#fff8ee;--mist:#cdbfe6;--ok:#3ddc84;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--night);color:var(--bone);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 16px}
main{max-width:560px;margin:0 auto;display:grid;gap:16px}
h1{margin:0;font-size:1.5rem}
p{margin:0}
.muted{color:var(--mist);font-size:.9rem}
.dia{display:grid;gap:10px;padding:16px;border-radius:16px;background:var(--night-2)}
.dia h2{margin:0;font-size:1.05rem;color:var(--pumpkin-2)}
.fila{display:grid;grid-template-columns:9.5rem 1fr 3rem;gap:10px;align-items:center;font-size:.92rem}
.barra{height:14px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden}
.barra i{display:block;height:100%;background:var(--pumpkin);border-radius:99px}
.fila.final .barra i{background:var(--ok)}
.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.pct{color:var(--mist);font-weight:400;font-size:.8rem;display:block}
.extra{border-top:1px solid rgba(255,255,255,.1);padding-top:8px}
button{justify-self:start;border:0;border-radius:99px;padding:10px 16px;font:700 .95rem system-ui,sans-serif;background:var(--pumpkin);color:#2a1300;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>Embudo de la landing</h1>
  <p class="muted">Cuántas personas llegan a cada paso, por día (hora del centro de México). Cada celular cuenta una vez por paso. No incluye datos personales.</p>
  <button type="button" id="recargar">Actualizar</button>
  <div id="dias"><p class="muted">Cargando…</p></div>
</main>
<script>
const NOMBRES={visita:"Entraron a la landing",empieza:"Empezaron a escribir",registro:"Se registraron (paso 1)",sigue1:"Siguieron 1 marca",sigue2:"Siguieron 2 marcas",sigue3:"Siguieron las 3",grupo:"Tocaron el grupo",gracias:"Llegaron a gracias"};
const EMBUDO=["visita","empieza","registro","sigue1","sigue2","sigue3","grupo","gracias"];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fecha=d=>new Date(d+"T12:00:00").toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});
async function cargar(){
  const caja=document.getElementById("dias");
  try{
    const r=await fetch("/api/evento",{cache:"no-store"});
    const j=await r.json();
    const dias=Object.keys(j.dias||{}).sort().reverse();
    if(!dias.length){caja.innerHTML='<p class="muted">Todavía no hay visitas registradas.</p>';return}
    caja.innerHTML=dias.map(d=>{
      const o=j.dias[d],base=o.visita||0;
      const filas=EMBUDO.map((k,i)=>{const n=o[k]||0,pct=base?Math.round(n/base*100):0;
        return `<div class="fila${k==="grupo"||k==="gracias"?" final":""}"><span>${NOMBRES[k]}</span><span class="barra"><i style="width:${base?Math.min(100,n/base*100):0}%"></i></span><span class="num">${n}${i?`<span class="pct">${pct}%</span>`:""}</span></div>`}).join("");
      return `<section class="dia"><h2>${esc(fecha(d))}</h2>${filas}<div class="fila extra"><span>Le dieron play al video</span><span></span><span class="num">${o.play||0}</span></div></section>`;
    }).join("");
  }catch(e){caja.innerHTML='<p class="muted">No se pudo cargar. Revisa tu conexión e intenta de nuevo.</p>'}
}
document.getElementById("recargar").addEventListener("click",cargar);
cargar();
</script>
</body>
</html>
